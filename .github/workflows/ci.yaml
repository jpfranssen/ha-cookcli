name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint app and shell script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Check whitespace and shell script
        run: |
          git show --format= --check HEAD
          sh -n run.sh
          shellcheck --shell=sh run.sh

      - name: Lint Home Assistant app
        uses: frenck/action-addon-linter@v2.21
        with:
          path: .

      - name: Test Git synchronization with local repositories
        run: python3 -m unittest discover -s tests -p test_git_sync.py -v

  build:
    name: Build amd64 Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --pull --platform linux/amd64 --tag ha-cookcli:ci .

      - name: Check packaged script and CookCLI binary
        run: |
          docker run --rm --entrypoint /bin/sh ha-cookcli:ci -n /run.sh
          docker run --rm --entrypoint cook ha-cookcli:ci --version

      - name: Test persistent user setup and restarts
        run: python3 tests/test_startup.py

      - name: Test packaged Git backend
        run: >-
          docker run --rm -v "$PWD/tests:/tests:ro"
          -e PYTHONPATH=/app -e PYTHONDONTWRITEBYTECODE=1
          --entrypoint python3 ha-cookcli:ci
          -m unittest discover -s /tests -p test_git_sync.py -v

      - name: Test authenticated web edits and HTTPS Git synchronization
        run: >-
          docker run --rm -v "$PWD/tests:/tests:ro"
          -e PYTHONPATH=/app -e PYTHONDONTWRITEBYTECODE=1
          --entrypoint python3 ha-cookcli:ci /tests/container_git_sync.py -v
