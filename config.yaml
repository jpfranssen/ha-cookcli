name: CookCLI
version: "0.2.1"
slug: cookcli
description: Cooklang recipe server with user management
url: https://github.com/jpfranssen/ha-cookcli
stage: experimental
arch:
  - amd64
init: false
ports:
  9080/tcp: 9080
ports_description:
  9080/tcp: CookCLI web interface
map:
  - type: share
    read_only: false
options:
  users: []
schema:
  users:
    - username: "match(^[a-zA-Z0-9_-]{1,32}$)"
      password: password
